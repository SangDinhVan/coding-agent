[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sang-coding-agent"
version = "0.1.0"
description = "Personal AI coding agent CLI"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "tiktoken",
]

[project.scripts]
coding-agent = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/sang-coding-agent/helpers" = ["sandbox-image/sandbox_fs.py", "sandbox-image/sandbox_exec.py"]
