<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Claude-like AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* ============ TOKENS / THEMES ============ */
  :root {
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

    /* Light (mặc định) — tông xanh tươi mát */
    --bg-app: #eef4fa;
    --bg-sidebar: #e4edf6;
    --bg-panel: #ffffff;
    --bg-input: #ffffff;
    --bg-hover: #d9e6f2;
    --bg-user-bubble: #e3edf7;
    --bg-code: #1e2530;
    --bg-code-head: #2a3342;

    --text-primary: #1c2430;
    --text-secondary: #55677a;
    --text-tertiary: #8b9aab;
    --text-code: #e8edf3;

    --accent: #2e7cd6;
    --accent-hover: #2568b8;
    --accent-soft: #d9e9fb;
    --accent-deep: #2a63ad;
    --border: #d8e2ec;
    --border-strong: #c2d2e0;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 4px 14px rgba(0,0,0,.08);
    --radius-lg: 18px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  [data-theme="dark"] {
    --bg-app: #121a24;
    --bg-sidebar: #16202c;
    --bg-panel: #182230;
    --bg-input: #1e2a3a;
    --bg-hover: #253549;
    --bg-user-bubble: #20303f;
    --bg-code: #0f151d;
    --bg-code-head: #1a2431;

    --text-primary: #e7edf4;
    --text-secondary: #a7b6c6;
    --text-tertiary: #74849a;
    --text-code: #e8edf3;

    --accent: #4d9bee;
    --accent-hover: #6faef2;
    --accent-soft: #1c3a5e;
    --accent-deep: #2a6fc4;
    --border: #26384c;
    --border-strong: #33495f;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
    --shadow-md: 0 4px 14px rgba(0,0,0,.4);
  }

  /* ============ RESET / BASE ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    background: var(--bg-app);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background .25s ease, color .25s ease;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ LAYOUT ============ */
  .app { display: flex; height: 100vh; width: 100vw; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 288px;
    flex-shrink: 0;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar.collapsed { margin-left: -288px; }

  .sidebar-top { padding: 14px 14px 8px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px 14px;
  }
  .brand-logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    display: grid; place-items: center; color: #fff; font-weight: 700;
    box-shadow: var(--shadow-sm);
  }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -.2px; }
  .brand-sub { font-size: 11px; color: var(--text-tertiary); }

  .new-chat-btn {
    display: flex; align-items: center; gap: 9px;
    width: 100%; padding: 11px 13px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 14px; font-weight: 500;
    box-shadow: var(--shadow-sm);
    transition: all .15s ease;
  }
  .new-chat-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }

  .sidebar-label {
    font-size: 11px; font-weight: 600; letter-spacing: .5px;
    text-transform: uppercase; color: var(--text-tertiary);
    padding: 16px 16px 6px;
  }
  .conv-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
  .conv-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    padding: 10px 12px; margin-bottom: 3px;
    border-radius: var(--radius-sm);
    font-size: 13.5px; color: var(--text-secondary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background .12s ease;
  }
  .conv-item:hover { background: var(--bg-hover); }
  .conv-item.active { background: var(--bg-hover); color: var(--text-primary); font-weight: 500; }
  .conv-item .title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .conv-item .del {
    opacity: 0; width: 22px; height: 22px; border-radius: 6px;
    display: grid; place-items: center; color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .conv-item:hover .del { opacity: 1; }
  .conv-item .del:hover { background: rgba(200,60,60,.15); color: #d05656; }

  .sidebar-bottom { padding: 12px; border-top: 1px solid var(--border); }
  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: var(--radius-sm);
    transition: background .12s ease;
  }
  .user-card:hover { background: var(--bg-hover); }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center; font-weight: 600; font-size: 13px;
    color: #fff; flex-shrink: 0;
  }
  .avatar.ai { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); }
  .avatar.user { background: linear-gradient(135deg, #14b8a6, #0d9488); }
  .user-meta { flex: 1; min-width: 0; }
  .user-name { font-size: 13.5px; font-weight: 500; }
  .user-plan { font-size: 11.5px; color: var(--text-tertiary); }

  .icon-btn {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    display: grid; place-items: center; color: var(--text-secondary);
    transition: background .12s ease, color .12s ease;
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* ---- Main ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
  .topbar {
    height: 56px; flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-app);
  }
  .topbar .title { font-size: 14.5px; font-weight: 600; }
  .topbar .model-pill {
    font-size: 12px; color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 3px 9px; border-radius: 20px;
    background: var(--bg-panel);
  }
  .topbar .spacer { flex: 1; }

  /* ---- Messages ---- */
  .chat-scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat-inner { max-width: 780px; margin: 0 auto; padding: 26px 20px 12px; }

  /* Welcome */
  .welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8vh 20px 30px; }
  .welcome-logo {
    width: 56px; height: 56px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 700;
    box-shadow: var(--shadow-md); margin-bottom: 20px;
    animation: pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .welcome h1 { font-size: 27px; font-weight: 600; letter-spacing: -.5px; margin-bottom: 8px; }
  .welcome p { color: var(--text-secondary); font-size: 15px; max-width: 440px; line-height: 1.6; }
  .suggestions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 30px; width: 100%; max-width: 560px; }
  .suggestion {
    text-align: left; padding: 14px 15px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    transition: all .15s ease;
  }
  .suggestion:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .suggestion .s-title { font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .suggestion .s-desc { font-size: 12.5px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.45; }

  /* Message rows */
  .msg { display: flex; gap: 13px; padding: 16px 0; animation: fadeUp .35s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg .avatar { width: 32px; height: 32px; font-size: 12px; }
  .msg-body { flex: 1; min-width: 0; }
  .msg-author { font-size: 13px; font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
  .msg-author .time { font-size: 11px; font-weight: 400; color: var(--text-tertiary); }
  .msg-content { font-size: 15px; line-height: 1.7; color: var(--text-primary); word-wrap: break-word; }
  .msg-actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity .15s ease; }
  .msg:hover .msg-actions { opacity: 1; }
  .msg-actions button {
    font-size: 12px; color: var(--text-tertiary);
    padding: 4px 8px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .msg-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }

  /* ---- Markdown rendering ---- */
  .md > * + * { margin-top: 10px; }
  .md p { line-height: 1.7; }
  .md h1, .md h2, .md h3 { font-weight: 600; letter-spacing: -.3px; margin-top: 16px; line-height: 1.3; }
  .md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md ul, .md ol { padding-left: 22px; line-height: 1.7; }
  .md li { margin-top: 4px; }
  .md a { color: var(--accent); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md strong { font-weight: 600; }
  .md blockquote { border-left: 3px solid var(--accent); padding: 4px 14px; color: var(--text-secondary); background: var(--bg-user-bubble); border-radius: 0 8px 8px 0; }
  .md code.inline {
    font-family: var(--font-mono); font-size: 13px;
    background: var(--bg-user-bubble); border: 1px solid var(--border);
    padding: 1.5px 6px; border-radius: 6px;
  }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

  /* Code block */
  .code-block { border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); margin-top: 12px; }
  .code-head {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg-code-head);
    padding: 7px 8px 7px 14px;
  }
  .code-lang { font-family: var(--font-mono); font-size: 11.5px; color: #9db0c4; text-transform: lowercase; }
  .copy-btn {
    font-size: 12px; color: #9db0c4;
    padding: 4px 10px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: background .12s ease, color .12s ease;
  }
  .copy-btn:hover { background: rgba(255,255,255,.1); color: #fff; }
  .copy-btn.copied { color: #7fdca0; }
  .code-block pre {
    margin: 0; padding: 14px 16px; overflow-x: auto;
    background: var(--bg-code);
  }
  .code-block code { font-family: var(--font-mono); font-size: 13px; line-height: 1.6; color: var(--text-code); }
  /* simple syntax colors */
  .tk-kw { color: #c792ea; } .tk-str { color: #c3e88d; } .tk-num { color: #f78c6c; }
  .tk-com { color: #6b7280; font-style: italic; } .tk-fn { color: #82aaff; }

  /* Typing indicator */
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 6px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-tertiary); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .cursor { display: inline-block; width: 8px; height: 17px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s steps(2) infinite; border-radius: 2px; margin-left: 1px; }

  /* ---- Composer ---- */
  .composer-wrap { flex-shrink: 0; padding: 8px 16px 18px; }
  .composer {
    max-width: 780px; margin: 0 auto;
    background: var(--bg-input);
    border: 1px solid var(--border-strong);
    border-radius: 22px;
    box-shadow: var(--shadow-md);
    transition: border-color .15s ease;
    overflow: hidden;
  }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea {
    width: 100%; border: none; outline: none; resize: none;
    background: transparent; color: var(--text-primary);
    font-family: var(--font-sans); font-size: 15px; line-height: 1.6;
    padding: 15px 18px 6px; max-height: 200px;
  }
  .composer textarea::placeholder { color: var(--text-tertiary); }
  .composer-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 12px 16px; }
  .composer-row .hint { font-size: 11.5px; color: var(--text-tertiary); flex: 1; }
  .send-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    transition: all .15s ease;
    box-shadow: var(--shadow-sm);
  }
  .send-btn:hover:not(:disabled) { background: var(--accent-hover); transform: scale(1.05); }
  .send-btn:disabled { background: var(--border-strong); color: var(--text-tertiary); cursor: not-allowed; }
  .send-btn.stop { background: #d05656; }
  .send-btn.stop:hover { background: #b84747; }
  .disclaimer { text-align: center; font-size: 11.5px; color: var(--text-tertiary); margin-top: 10px; }

  /* Toast */
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--text-primary); color: var(--bg-app);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 500;
    box-shadow: var(--shadow-md); opacity: 0; pointer-events: none;
    transition: all .25s ease; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Mobile */
  .menu-btn { display: none; }
  @media (max-width: 720px) {
    .sidebar { position: absolute; z-index: 50; height: 100%; box-shadow: var(--shadow-md); }
    .menu-btn { display: grid; }
    .suggestions { grid-template-columns: 1fr; }
    .welcome h1 { font-size: 23px; }
  }
</style>
</head>
<body data-theme="light">
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-logo">✦</div>
        <div>
          <div class="brand-name">Nova AI</div>
          <div class="brand-sub">Cá nhân · Free</div>
        </div>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
        Cuộc trò chuyện mới
      </button>
    </div>

    <div class="sidebar-label">Gần đây</div>
    <div class="conv-list" id="convList"></div>

    <div class="sidebar-bottom">
      <div class="user-card">
        <div class="avatar user">B</div>
        <div class="user-meta">
          <div class="user-name">Bạn</div>
          <div class="user-plan">Tài khoản miễn phí</div>
        </div>
        <button class="icon-btn" id="themeBtn" title="Đổi giao diện">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" title="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="title" id="chatTitle">Cuộc trò chuyện mới</span>
      <span class="model-pill">nova-1</span>
      <div class="spacer"></div>
      <button class="icon-btn" id="clearBtn" title="Xóa cuộc trò chuyện hiện tại">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
      </button>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Nhắn tin cho Nova AI… (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
        <div class="composer-row">
          <span class="hint">Nova AI có thể nhầm lẫn. Kiểm tra lại thông tin quan trọng.</span>
          <button class="send-btn" id="sendBtn" disabled title="Gửi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="disclaimer">Giao diện demo — trả lời do mô phỏng phía client, chưa nối API thật.</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Nova AI — Frontend demo chatbot (không phụ thuộc thư viện)
   - Multi hội thoại, lưu localStorage
   - Streaming chữ (typewriter) + dừng được
   - Render Markdown đơn giản (code, bold, list, link, quote...)
   - Highlight syntax tối giản cho code
   ===================================================================== */

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const now = () => new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- State ---------- */
const sidebar = $('#sidebar');
const LS_KEY = 'nova_ai_chats_v1';
const LS_THEME = 'nova_ai_theme';
let chats = loadChats();
let activeId = null;
let generating = false;
let stopFlag = false;

function loadChats() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
  catch { return []; }
}
function saveChats() { localStorage.setItem(LS_KEY, JSON.stringify(chats)); }
function active() { return chats.find(c => c.id === activeId); }

/* ---------- Theme ---------- */
const themeBtn = $('#themeBtn');
function applyTheme(t) {
  document.body.dataset.theme = t;
  localStorage.setItem(LS_THEME, t);
  $('#themeIcon').innerHTML = t === 'dark'
    ? '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
}
applyTheme(localStorage.getItem(LS_THEME) || 'light');
themeBtn.onclick = () => applyTheme(document.body.dataset.theme === 'dark' ? 'light' : 'dark');

/* ---------- Markdown (đơn giản, an toàn XSS) ---------- */
function highlight(code) {
  const KW = /\b(const|let|var|function|return|if|else|for|while|do|class|import|from|export|default|async|await|new|def|print|elif|try|except|finally|raise|public|private|protected|static|void|int|float|double|bool|boolean|string|char|true|false|null|undefined|None|True|False|this|self|lambda|switch|case|break|continue|in|of|typeof)\b/;
  const TOKEN = /(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g;
  let out = '', last = 0, m;
  while ((m = TOKEN.exec(code)) !== null) {
    out += esc(code.slice(last, m.index));
    if (m[1]) out += '<span class="tk-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tk-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tk-num">' + esc(m[3]) + '</span>';
    else if (m[4]) out += (KW.test(m[4]) ? '<span class="tk-kw">' : '') + esc(m[4]) + (KW.test(m[4]) ? '</span>' : '');
    last = m.index + m[0].length;
  }
  out += esc(code.slice(last));
  return out;
}

function mdToHtml(src) {
  // tách code block ra trước
  const blocks = [];
  src = src.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return '\u0000BLOCK' + (blocks.length - 1) + '\u0000';
  });

  let html = esc(src);

  // inline code
  html = html.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
  // bold
  html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  // italic
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  // heading
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  // blockquote
  html = html.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
  // hr
  html = html.replace(/^---$/gm, '<hr>');
  // link
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // lists: gom các dòng "- " hoặc "1. "
  html = html.replace(/(?:^|\n)((?:- .*(?:\n|$))+)/g, (m, g) => {
    const items = g.trim().split('\n').map(l => '<li>' + l.replace(/^- /, '') + '</li>').join('');
    return '\n<ul>' + items + '</ul>';
  });
  html = html.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g, (m, g) => {
    const items = g.trim().split('\n').map(l => '<li>' + l.replace(/^\d+\. /, '') + '</li>').join('');
    return '\n<ol>' + items + '</ol>';
  });

  // paragraphs: tách theo \n\n
  html = html.split(/\n{2,}/).map(chunk => {
    const c = chunk.trim();
    if (!c) return '';
    if (/^<(h\d|ul|ol|blockquote|hr|div|pre|code)/.test(c) || c.startsWith('\u0000BLOCK')) return c;
    return '<p>' + c.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');

  // restore code blocks
  html = html.replace(/\u0000BLOCK(\d+)\u0000/g, (m, i) => {
    const b = blocks[+i];
    const id = 'cb_' + uid();
    return `<div class="code-block" data-code="${esc(b.code)}" data-id="${id}">
      <div class="code-head">
        <span class="code-lang">${esc(b.lang || 'code')}</span>
        <button class="copy-btn" data-target="${id}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span>Copy</span>
        </button>
      </div>
      <pre><code id="${id}">${highlight(b.code)}</code></pre>
    </div>`;
  });

  return html;
}

/* ---------- Streaming ---------- */
function streamText(el, text, onDone) {
  // stream theo từng "từ" cho tự nhiên, code block stream nhanh hơn
  el.classList.add('md');
  const parts = [];
  let i = 0;
  const cursor = document.createElement('span'); cursor.className = 'cursor';
  let timer;
  function tick() {
    if (stopFlag) { stopFlag = false; finish(); return; }
    // lấy 1-3 ký tự mỗi tick (nhanh dần ở cuối)
    const step = Math.random() < 0.4 ? 1 : 2;
    i = Math.min(text.length, i + step);
    parts[0] = text.slice(0, i);
    // render lại markdown an toàn (chưa đóng code block -> bọc tạm)
    el.innerHTML = safePartial(parts[0]) ;
    el.appendChild(cursor);
    scrollToBottom();
    if (i >= text.length) { finish(); return; }
    timer = setTimeout(tick, 14 + Math.random() * 26);
  }
  function finish() {
    clearTimeout(timer);
    el.innerHTML = mdToHtml(parts[0] ?? text);
    bindCodeCopy(el);
    onDone && onDone();
  }
  tick();
  return { stop: () => { stopFlag = true; } };
}

// render markdown "mở" khi đang stream: đóng lại code fence đang dở
function safePartial(text) {
  const openFences = (text.match(/```/g) || []).length % 2;
  return mdToHtml(text + (openFences ? '\n```' : ''));
}
function bindCodeCopy(scope) {
  scope.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = () => {
      const code = scope.querySelector('#' + CSS.escape(btn.dataset.target));
      copyText(code.textContent);
      const label = btn.querySelector('span');
      btn.classList.add('copied'); label.textContent = 'Đã copy!';
      setTimeout(() => { btn.classList.remove('copied'); label.textContent = 'Copy'; }, 1600);
    };
  });
}

/* ---------- Composer / send ---------- */
const input = $('#input');
const sendBtn = $('#sendBtn');

function autoGrow() {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  sendBtn.disabled = generating ? false : input.value.trim() === '';
  if (generating) updateSendBtn();
}
function updateSendBtn() {
  sendBtn.classList.toggle('stop', generating);
  sendBtn.title = generating ? 'Dừng' : 'Gửi';
  sendBtn.innerHTML = generating
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
}

input.addEventListener('input', autoGrow);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.onclick = () => {
  if (generating) { stopFlag = true; return; }
  send();
};

function send() {
  if (generating) return;
  const text = input.value.trim();
  if (!text) return;

  let chat = active();
  if (!chat) { chat = newChat(text, false); }

  const userMsg = { id: uid(), role: 'user', content: text, time: now() };
  chat.messages.push(userMsg);
  if (!chat.title || chat.title === 'Cuộc trò chuyện mới') chat.title = text.slice(0, 40);
  chat.updated = Date.now();
  saveChats();

  input.value = ''; autoGrow();
  renderConvList(); renderMessages(chat);

  // tạo placeholder AI đang stream
  const aiMsg = { id: uid(), role: 'assistant', content: '', time: now(), streaming: true };
  chat.messages.push(aiMsg); saveChats();
  renderMessages(chat);

  generating = true; stopFlag = false; updateSendBtn();
  const contentEl = chatInner.querySelector(`[data-mid="${aiMsg.id}"] .msg-content`);
  const full = generateReply(text);
  const runner = streamText(contentEl, full, () => {
    aiMsg.content = full; aiMsg.streaming = false;
    generating = false; updateSendBtn();
    saveChats(); renderConvList();
  });
  // lưu runner để stop
  sendBtn.dataset.run = '1';
  window.__runner = runner;
}

function regenerate() {
  const chat = active(); if (!chat || generating) return;
  const last = [...chat.messages].reverse().find(m => m.role === 'assistant');
  const lastUser = [...chat.messages].reverse().find(m => m.role === 'user');
  if (!lastUser) return;
  // xóa assistant cuối cùng rồi stream lại
  chat.messages = chat.messages.filter(m => m !== last);
  saveChats(); renderMessages(chat);
  const aiMsg = { id: uid(), role: 'assistant', content: '', time: now(), streaming: true };
  chat.messages.push(aiMsg); saveChats(); renderMessages(chat);
  generating = true; stopFlag = false; updateSendBtn();
  const contentEl = chatInner.querySelector(`[data-mid="${aiMsg.id}"] .msg-content`);
  const full = generateReply(lastUser.content);
  window.__runner = streamText(contentEl, full, () => {
    aiMsg.content = full; aiMsg.streaming = false;
    generating = false; updateSendBtn(); saveChats();
  });
}

/* ---------- Chat management ---------- */
function newChat(firstMsg, render = true) {
  const c = { id: uid(), title: firstMsg ? firstMsg.slice(0, 40) : 'Cuộc trò chuyện mới', messages: [], updated: Date.now() };
  chats.push(c); activeId = c.id; saveChats();
  if (render) { renderConvList(); renderMessages(c); $('#chatTitle').textContent = c.title; }
  return c;
}
function switchChat(id) {
  if (generating) { stopFlag = true; }
  activeId = id; saveChats();
  const c = active();
  renderConvList(); renderMessages(c);
  $('#chatTitle').textContent = c ? c.title : '';
  if (window.innerWidth <= 720) sidebar.classList.add('collapsed');
}
function deleteChat(id) {
  chats = chats.filter(c => c.id !== id);
  if (activeId === id) { activeId = chats[0]?.id || null; }
  saveChats(); renderConvList();
  const c = active();
  c ? (renderMessages(c), $('#chatTitle').textContent = c.title) : renderWelcome();
  toast('Đã xóa cuộc trò chuyện');
}

$('#newChatBtn').onclick = () => {
  if (generating) stopFlag = true;
  activeId = null;
  renderConvList(); renderWelcome();
  $('#chatTitle').textContent = 'Cuộc trò chuyện mới';
  input.focus();
};
$('#clearBtn').onclick = () => { if (active()) { deleteChat(activeId); } };
$('#menuBtn').onclick = () => sidebar.classList.toggle('collapsed');

/* ---------- Utils ---------- */
function scrollToBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }
function copyText(t) {
  navigator.clipboard?.writeText(t).catch(() => {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  });
}
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- Init ---------- */
renderConvList();
const first = [...chats].sort((a, b) => b.updated - a.updated)[0];
if (first) { activeId = first.id; renderMessages(first); $('#chatTitle').textContent = first.title; }
else renderWelcome();
input.focus();
</script>
</body>
</html>
