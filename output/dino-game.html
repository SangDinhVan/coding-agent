<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khủng Lỏng Runner 🦖 - Game giống Chrome</title>
<style>
  :root {
    --bg: #f7f7f7;
    --ink: #535353;
    --dino: #535353;
    --cactus: #535353;
    --red: #e63946;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Courier New', Courier, monospace;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    user-select: none;
    -webkit-user-select: none;
    padding: 16px;
  }
  .wrap {
    text-align: center;
    width: min(900px, 100%);
  }
  h1 {
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    color: #535353;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .sub {
    color: #9a9a9a;
    font-size: 0.95rem;
    margin-bottom: 16px;
  }
  .sub code {
    background: #e8e8e8;
    padding: 2px 8px;
    border-radius: 6px;
    color: #535353;
    font-weight: 700;
  }
  .game-shell {
    position: relative;
    background: #ffffff;
    border: 2px solid #e0e0e0;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    cursor: pointer;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #ffffff;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    background: #ffffff;
    border-top: 2px solid #e0e0e0;
    font-weight: 700;
    color: #535353;
  }
  .hud .score { font-size: 1.1rem; }
  .hud .score span { color: var(--red); }
  .hud .best { font-size: 0.9rem; color: #9a9a9a; }
  .btn {
    font-family: inherit;
    font-weight: 700;
    border: 2px solid #535353;
    background: #fff;
    color: #535353;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .btn:hover { background: #535353; color: #fff; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(255,255,255,0.0);
    pointer-events: none;
  }
  .overlay .big {
    font-size: 2.4rem;
    color: #535353;
  }
  .overlay .hint {
    font-size: 0.9rem;
    color: #9a9a9a;
  }
  .hidden { display: none; }
  footer { margin-top: 12px; color: #bdbdbd; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🦖 Khủng Lỏng Runner</h1>
  <p class="sub">Nhấn <code>SPACE</code> / <code>↑</code> hoặc <b>chạm màn hình</b> để nhảy</p>

  <div class="game-shell" id="shell">
    <canvas id="game" width="900" height="400"></canvas>

    <div class="overlay" id="overlay">
      <div class="big">🦖</div>
      <div class="hint">Nhấn SPACE hoặc chạm để bắt đầu</div>
    </div>

    <div class="overlay hidden" id="gameoverOverlay">
      <div class="big">💥 GAME OVER</div>
      <div class="hint" id="finalScore">Điểm: 0</div>
      <button class="btn" id="restartBtn">🔄 Chơi lại</button>
    </div>

    <div class="hud">
      <div class="score">Điểm: <span id="score">0</span></div>
      <div class="best">🏆 Kỷ lục: <span id="best">0</span></div>
    </div>
  </div>

  <footer>Game "khủng lỏng" lấy cảm hứng từ Chrome Dino · chơi vui đừng phá bàn phím 😆</footer>
</div>

<script>
(() => {
  // ===== CANVAS =====
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // ===== GROUND =====
  const GROUND_Y = 320;
  const GRAVITY = 0.6;
  const JUMP_FORCE = -12.5;

  // ===== GAME STATE =====
  let gameSpeed = 1.5;
  let score = 0;
  let best = Number(localStorage.getItem('dinoBest') || 0);
  let state = 'waiting'; // waiting | running | dead
  let frame = 0;

  // ===== DINO =====
  const dino = {
    x: 90,
    y: GROUND_Y,
    w: 50,
    h: 55,
    vy: 0,
    grounded: true,
    ducking: false,
    blinkTimer: 0,
    glasses: true,
  };

  // ===== OBSTACLES =====
  let obstacles = [];
  let clouds = [];
  let particles = [];

  // ===== SOUND (Web Audio beep) =====
  let audioCtx = null;
  function beep(freq = 520, duration = 0.08, type = 'square', vol = 0.15) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = vol;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) { /* ignore audio errors */ }
  }

  function jumpSound() { beep(660, 0.09, 'square', 0.12); }
  function deadSound() {
    beep(220, 0.15, 'sawtooth', 0.18);
    setTimeout(() => beep(160, 0.2, 'sawtooth', 0.16), 120);
  }
  function scoreSound() { beep(880, 0.06, 'sine', 0.1); }

  // ===== HELPERS =====
  function formatScore(n) {
    return String(Math.floor(n)).padStart(5, '0');
  }

  // ===== SPAWN =====
  function spawnObstacle() {
    const r = Math.random();
    const types = [
      { type: 'cactus', w: 22, h: 45, emoji: '🌵' },
      { type: 'cactus', w: 30, h: 55, emoji: '🌵' },
      { type: 'rock', w: 26, h: 24, emoji: '🪨' },
    ];
    // Thỉnh thoảng spawn chim bay
    if (r < 0.2) {
      obstacles.push({ type: 'bird', x: W + 40, y: GROUND_Y - 48 - Math.random() * 30, w: 36, h: 26, emoji: '🐦' });
    } else {
      const t = types[Math.floor(Math.random() * types.length)];
      obstacles.push({ ...t, x: W + 40, y: GROUND_Y - t.h });
    }
  }

  function spawnCloud() {
    clouds.push({
      x: W + 60,
      y: 40 + Math.random() * 120,
      w: 50 + Math.random() * 40,
      speed: 0.5 + Math.random() * 1,
      emoji: Math.random() < 0.5 ? '☁️' : '⛅',
    });
  }

  // ===== COLLISION =====
  function hitTest(a, b) {
    // Thu nhỏ hitbox cho công bằng
    const padX = 6, padY = 4;
    return a.x + padX < b.x + b.w - padX &&
           a.x + a.w - padX > b.x + padX &&
           a.y + padY < b.y + b.h - padY &&
           a.y + a.h - padY > b.y + padY;
  }

  // ===== PARTICLES =====
  function spawnParticles(x, y) {
    for (let i = 0; i < 14; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * 6,
        vy: -Math.random() * 6 - 2,
        life: 1,
        char: ['🦴', '💨', '✨', '🪶'][Math.floor(Math.random() * 4)],
      });
    }
  }

  // ===== UPDATE =====
  function update() {
    frame++;

    // Dino physics
    if (!dino.grounded) {
      dino.vy += GRAVITY;
      dino.y += dino.vy;
      if (dino.y >= GROUND_Y) {
        dino.y = GROUND_Y;
        dino.vy = 0;
        dino.grounded = true;
      }
    }

    // Blink
    dino.blinkTimer--;
    if (dino.blinkTimer <= 0) {
      dino.blinkTimer = 80 + Math.random() * 120;
    }

    // Spawn obstacles based on score/speed
    if (frame % Math.max(40, Math.floor(120 - gameSpeed * 8)) === 0) {
      spawnObstacle();
    }
    if (frame % 200 === 0) spawnCloud();

    // Move obstacles
    obstacles.forEach(o => o.x -= gameSpeed);
    obstacles = obstacles.filter(o => o.x > -80);

    // Move clouds
    clouds.forEach(c => c.x -= c.speed);
    clouds = clouds.filter(c => c.x > -100);

    // Particles
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.life -= 0.04;
    });
    particles = particles.filter(p => p.life > 0);

    // Score
    if (state === 'running') {
      score += gameSpeed * 0.15;
      // Tăng tốc theo điểm
      gameSpeed = Math.min(14, 6 + score / 300);
    }

    // Collision
    const dinoBox = { x: dino.x, y: dino.y - dino.h, w: dino.w, h: dino.h };
    for (const o of obstacles) {
      const oBox = { x: o.x, y: o.y, w: o.w, h: o.h };
      if (hitTest(dinoBox, oBox)) {
        die();
        break;
      }
    }
  }

  // ===== DRAW =====
  function drawDino() {
    const x = dino.x;
    const y = dino.y;
    const h = dino.h;
    const duck = dino.ducking && dino.grounded;

    ctx.save();
    ctx.translate(x + dino.w / 2, y);

    // Body
    ctx.fillStyle = '#535353';
    ctx.strokeStyle = '#3a3a3a';
    ctx.lineWidth = 2;

    if (duck) {
      // Dạng cúi người
      ctx.fillRect(-22, -22, 50, 22);
      ctx.fillStyle = '#fff';
      ctx.fillRect(-8, -18, 5, 5);
      ctx.fillStyle = '#535353';
      ctx.fillRect(12, -22, 14, 8);
    } else {
      // Thân
      ctx.beginPath();
      ctx.roundRect(-20, -h, 40, h - 12, 8);
      ctx.fill();

      // Đầu
      ctx.beginPath();
      ctx.arc(14, -h - 8, 16, 0, Math.PI * 2);
      ctx.fill();

      // Mắt
      const blink = dino.blinkTimer < 6;
      if (blink) {
        ctx.strokeStyle = '#535353';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(14, -h - 8);
        ctx.lineTo(24, -h - 8);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(16, -h - 11, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#222';
        ctx.beginPath();
        ctx.arc(17, -h - 11, 2.4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Kính khủng lỏng 😎
      if (dino.glasses && !blink) {
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(14, -h - 11, 7, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath();
        ctx.arc(14, -h - 11, 7, 0, Math.PI * 2);
        ctx.fill();
      }

      // Miệng cười
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(22, -h - 2, 5, 0.2, Math.PI - 0.2);
      ctx.stroke();

      // Chân
      const legOffset = dino.grounded ? 0 : -6;
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(-12, -14 + legOffset, 6, 14);
      ctx.fillRect(6, -14 - legOffset, 6, 14);

      // Đuôi
      ctx.fillStyle = '#535353';
      ctx.beginPath();
      ctx.moveTo(-20, -10);
      ctx.lineTo(-38, -22);
      ctx.lineTo(-20, -2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawGround() {
    ctx.strokeStyle = '#c9c9c9';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y + 0.5);
    ctx.lineTo(W, GROUND_Y + 0.5);
    ctx.stroke();

    // Gạch dưới đất di chuyển
    const offset = (frame * gameSpeed) % 40;
    ctx.fillStyle = '#e0e0e0';
    for (let x = -offset; x < W; x += 40) {
      ctx.fillRect(x, GROUND_Y + 6, 18, 3);
    }
  }

  function drawEmoji(emoji, x, y, size) {
    ctx.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, x, y);
  }

  function drawObstacles() {
    for (const o of obstacles) {
      drawEmoji(o.emoji, o.x + o.w / 2, o.y + o.h / 2, Math.max(o.w, o.h) + 8);
    }
  }

  function drawClouds() {
    for (const c of clouds) {
      ctx.globalAlpha = 0.7;
      drawEmoji(c.emoji, c.x, c.y, c.w);
      ctx.globalAlpha = 1;
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      drawEmoji(p.char, p.x, p.y, 18);
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawGround();
    drawClouds();
    drawObstacles();
    drawParticles();
    drawDino();
  }

  // ===== DIE / RESET =====
  function die() {
    if (state !== 'running') return;
    state = 'dead';
    dino.glasses = false;
    deadSound();
    spawnParticles(dino.x + dino.w / 2, dino.y - dino.h / 2);

    // Cập nhật kỷ lục
    const s = Math.floor(score);
    if (s > best) {
      best = s;
      localStorage.setItem('dinoBest', best);
    }
    document.getElementById('best').textContent = formatScore(best);
    document.getElementById('finalScore').textContent = 'Điểm: ' + formatScore(s);
    document.getElementById('gameoverOverlay').classList.remove('hidden');
    updateScoreDisplay();
  }

  function reset() {
    state = 'running';
    score = 0;
    gameSpeed = 6;
    frame = 0;
    obstacles = [];
    clouds = [];
    particles = [];
    dino.y = GROUND_Y;
    dino.vy = 0;
    dino.grounded = true;
    dino.glasses = true;
    document.getElementById('gameoverOverlay').classList.add('hidden');
    document.getElementById('overlay').classList.add('hidden');
    updateScoreDisplay();
  }

  function jump() {
    if (state === 'waiting') {
      reset();
      jump();
      return;
    }
    if (state === 'dead') return;
    if (dino.grounded) {
      dino.vy = JUMP_FORCE;
      dino.grounded = false;
      jumpSound();
    }
  }

  function duck(active) {
    if (state === 'running') {
      dino.ducking = active;
      if (active && dino.grounded) dino.h = 30;
      else dino.h = 55;
    }
  }

  function updateScoreDisplay() {
    document.getElementById('score').textContent = formatScore(score);
  }

  // ===== GAME LOOP =====
  function loop() {
    if (state === 'running' || state === 'dead') update();
    draw();
    if (state === 'running') updateScoreDisplay();
    requestAnimationFrame(loop);
  }

  // ===== INPUT =====
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      jump();
    } else if (e.code === 'ArrowDown') {
      e.preventDefault();
      duck(true);
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowDown') {
      duck(false);
    }
  });

  // Chạm / click
  const shell = document.getElementById('shell');
  shell.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state === 'dead') return;
    jump();
  });

  document.getElementById('restartBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    reset();
  });

  // ===== POLYFILL roundRect cho Safari =====
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ===== START =====
  document.getElementById('best').textContent = formatScore(best);
  updateScoreDisplay();
  loop();
})();
</script>
</body>
</html>
