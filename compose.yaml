services:
  coding-agent:
    build: .
    stdin_open: true
    tty: true
    working_dir: /workspace
    env_file:
      - .env
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      WORKSPACE: /workspace
      STATE_ROOT: /state
    volumes:
      - .:/workspace
      - coding-agent-state:/state
      - ${DOCKER_SOCKET:-${XDG_RUNTIME_DIR:-/var/run}/docker.sock}:/var/run/docker.sock

volumes:
  coding-agent-state:
